          { label: "縺九↑繧頑髪髫懊′縺ゅｋ", value: "high" },

        ]

          { label: "逕ｳ隲九＠縺溘′荳肴髪邨ｦ縺縺｣縺・, value: "rejected" },
          { label: "逕ｳ隲倶ｸｭ", value: "inProgress" },
          { label: "蛻・°繧峨↑縺・, value: "unknown" }
        ]
      },
      {
        id: "complexFactors",
        text: "莠区腐繝ｻ蜉ｴ轣ｽ繝ｻ蜀・ｸ・未菫ゅ↑縺ｩ縺ｮ隍・尅隕∫ｴ縺ｯ縺ゅｊ縺ｾ縺吶°・・,
        options: [

          { label: "蜉ｴ轣ｽ縺碁未菫ゅ＠縺ｦ縺・ｋ", value: "workInjury" },
          { label: "蜀・ｸ・未菫ゅ↑縺ｩ螳ｶ譌城未菫ゅ・遒ｺ隱阪′蠢・ｦ・, value: "family" },

          { label: "蛻・°繧峨↑縺・, value: "unknown" }
        ]
      },
      {
        id: "region",
        text: "驛ｽ驕灘ｺ懃恁繧帝∈繧薙〒縺上□縺輔＞縲・,
        options: [
          { label: "蟇悟ｱｱ繝ｻ遏ｳ蟾・, value: "hokuriku" },
          { label: "縺昴・莉悶・蝨ｰ蝓・, value: "other" }
        ]
      }
    ];

    const answers = {};
    let currentIndex = 0;

    const questionEl = document.getElementById("question");
    const optionsEl = document.getElementById("options");
    const stepLabelEl = document.getElementById("stepLabel");
    const progressBar = document.getElementById("progressBar");
    const backButton = document.getElementById("backButton");
    const restartButton = document.getElementById("restartButton");

    backButton.addEventListener("click", () => {
      if (currentIndex > 0) {
        currentIndex -= 1;
        renderQuestion();
      }
    });

    restartButton.addEventListener("click", restart);

    function renderQuestion() {
      const q = questions[currentIndex];
      const progress = Math.round((currentIndex / questions.length) * 100);

      stepLabelEl.textContent = `${currentIndex + 1} / ${questions.length}`;
      progressBar.style.width = `${progress}%`;
      questionEl.textContent = q.text;
      optionsEl.innerHTML = "";

      q.options.forEach((option) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "option";
        button.textContent = option.label;
        button.addEventListener("click", () => {
          answers[q.id] = option.value;
          if (currentIndex < questions.length - 1) {
            currentIndex += 1;
            renderQuestion();
          } else {
            showResult();
          }
        });
        optionsEl.appendChild(button);
      });

      backButton.disabled = currentIndex === 0;
    }

    function showResult() {
      progressBar.style.width = "100%";
      document.getElementById("chat").classList.add("hidden");
      document.getElementById("result").classList.remove("hidden");

      const score = calculateScore();
      const result = buildResult(score);

      document.getElementById("resultTitle").textContent = result.title;
      document.getElementById("resultBody").textContent = result.body;

      renderLeads();
    }

    function calculateScore() {
      let score = 0;

      if (answers.age === "20to64") score += 2;
      if (answers.age === "under20" || answers.age === "65plus") score += 1;

      if (answers.firstVisit === "known") score += 2;
      if (answers.firstVisit === "rough") score += 1;

      if (answers.pensionTypeAtFirstVisit === "employee" || answers.pensionTypeAtFirstVisit === "mutualAid") score += 2;
      if (answers.pensionTypeAtFirstVisit === "national") score += 1;

      if (answers.pensionPaid === "ok") score += 2;
      if (answers.pensionPaid === "unclear") score += 1;

      if (answers.afterOneYearSixMonths === "yes") score += 2;
      if (answers.afterOneYearSixMonths === "unknown") score += 1;

      if (answers.dailyLife === "high") score += 2;
      if (answers.dailyLife === "medium") score += 1;

      if (answers.work === "notWorking") score += 2;
      if (answers.work === "limited") score += 1;

      if (answers.applicationHistory === "rejected") score += 1;
      if (answers.applicationHistory === "unknown") score -= 1;

      if (answers.complexFactors === "accident" || answers.complexFactors === "workInjury" || answers.complexFactors === "family") score -= 1;
      if (answers.complexFactors === "unknown") score -= 1;

      return score;
    }

    function buildResult(score) {
      if (answers.afterOneYearSixMonths === "no") {
        return {
          title: "蟇ｾ雎｡螟悶・蜿ｯ閭ｽ諤ｧ縺後≠繧翫∪縺・,
          body: "蛻晁ｨｺ譌･縺九ｉ1蟷ｴ6縺区怦繧堤ｵ碁℃縺励※縺・↑縺・ｴ蜷医∫樟譎らせ縺ｧ縺ｯ逕ｳ隲区凾譛溘・遒ｺ隱阪′蠢・ｦ√〒縺吶ゆｾ句､悶ｂ縺ゅｋ縺溘ａ蟆る摩螳ｶ遒ｺ隱阪ｒ縺翫☆縺吶ａ縺励∪縺吶・
        };
      }

      if (
        answers.firstVisit === "unknown" ||
        answers.pensionPaid === "unknown" ||
        answers.pensionTypeAtFirstVisit === "unknown"
      ) {
        return {
          title: "繝√Ε繝・ヨ縺ｧ縺ｯ蛻､螳壹〒縺阪∪縺帙ｓ",
          body: "蛻晁ｨｺ譌･縲∝ｹｴ驥大刈蜈･迥ｶ豕√∽ｿ晞匱譁咏ｴ堺ｻ倡憾豕√・遒ｺ隱阪′蠢・ｦ√〒縺吶ょ・縺九ｋ遽・峇繧呈紛逅・＠縺ｦ蟆る摩螳ｶ縺ｸ逶ｸ隲・＠縺ｦ縺上□縺輔＞縲・
        };
      }

      if (score >= 12) {
        return {
          title: "蜿礼ｵｦ蜿ｯ閭ｽ諤ｧ縺碁ｫ倥＞",
          body: "蛻晁ｨｺ譌･縲∽ｿ晞匱譁咏ｴ堺ｻ倡憾豕√∵律蟶ｸ逕滓ｴｻ繧・ｰｱ蜉ｴ迥ｶ豕√ｒ謨ｴ逅・＠縺溘≧縺医〒縲∝ｰる摩螳ｶ縺ｸ縺ｮ逶ｸ隲・ｒ縺翫☆縺吶ａ縺励∪縺吶・
        };
      }

      if (score >= 8) {
        return {
          title: "蜿礼ｵｦ蜿ｯ閭ｽ諤ｧ縺後≠繧翫∪縺・,
          body: "遒ｺ隱阪☆縺ｹ縺埼・岼縺梧ｮ九▲縺ｦ縺・∪縺吶ょ・險ｺ譌･繧・ｿ晞匱譁咏ｴ堺ｻ倡憾豕√ｒ謨ｴ逅・＠縺ｦ逶ｸ隲・↓騾ｲ繧縺ｮ縺後ｈ縺・憾諷九〒縺吶・
        };
      }

      if (score >= 4) {
